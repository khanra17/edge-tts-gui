<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text to Speech</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="editor">
        <label class="sr-only" for="content">Text Content</label>
        <textarea id="content" spellcheck="false" placeholder="Type or drop a text file here..."></textarea>
        <div class="meta">
          <span id="status">Ready</span>
          <span id="count">Count: 0</span>
        </div>
      </section>

      <section class="controls" aria-label="Voice Controls">
        <fieldset class="group selects">
          <legend>Voice</legend>
          <label>
            <span>Language</span>
            <select id="language"></select>
          </label>
          <label>
            <span>Voice</span>
            <select id="voice"></select>
          </label>
        </fieldset>

        <fieldset class="group speed-group">
          <legend>Speed (<span id="speed-val">1.0x</span>)</legend>
          <div class="speed-control">
            <input type="range" id="speed" min="0.5" max="3.0" step="0.1" value="1.0" />
          </div>
        </fieldset>
      </section>

      <progress id="progress" value="0" max="100" hidden></progress>

      <footer class="actions">
        <button type="button" id="play" class="primary">Play</button>
        <button type="button" id="stop" disabled>Stop</button>
        <button type="button" id="save">Save</button>
        <button type="button" id="close">Close</button>
      </footer>
    </main>
  </body>
</html>
