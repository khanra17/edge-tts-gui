[package]
name = "edge-speak"
version = "0.1.0"
description = "A lightweight Edge TTS reader"
edition = "2024"
rust-version = "1.99"
license = "LGPL-3.0-or-later"

[lib]
name = "edge_speak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures-util = { version = "0.3.34", features = ["sink"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tokio = { version = "1.53.3", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.28.0", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.4"

[target.'cfg(windows)'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"
arboard = { version = "3.7.0", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
